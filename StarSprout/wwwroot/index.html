function modRows(){const found=visibleMods();const locked=busy||modsRunning();if(!found.length)return empty(modSearch?'没有匹配的 Mod':'还没有安装 Mod',modSearch?'换个关键词再试试。':'导入作者提供的 ZIP，或到资源中心选择 Mod。','mods');return found.map(({mod,index})=>`<div class="list-row"><input class="mod-check" type="checkbox" data-mod-select="${index}" aria-label="选择 ${esc(mod.name)}" ${selectedMods.has(mod.directoryPath)?'checked':''} ${locked?'disabled':''}><div class="item-icon">${icon('mods')}</div><div class="item-main" title="${esc(mod.uniqueId+'\n'+mod.directoryPath)}"><div class="item-name">${esc(mod.name)}</div><div class="item-meta">${esc(mod.version||'未知版本')} · ${esc(mod.author||'未知作者')} · ${mod.enabled?'已启用':'已禁用'}</div>${mod.status&& !['可用','已停用','已禁用'].includes(mod.status)?`<div class="dependency">${esc(mod.status)}</div>`:''}</div><div class="row-actions"><button type="button" class="button small danger" data-feature="removeMod" data-mod-index="${index}" ${locked?'disabled':''}>删除</button><button type="button" class="button small ${mod.enabled?'':'soft'}" data-toggle="${index}" ${locked?'disabled':''}>${mod.enabled?'禁用':'启用'}</button><button type="button" class="toggle ${mod.enabled?'on':''}" role="switch" aria-checked="${!!mod.enabled}" aria-label="${mod.enabled?'禁用':'启用'} ${esc(mod.name)}" title="${mod.enabled?'禁用':'启用'}" data-toggle="${index}" ${locked?'disabled':''}></button></div></div>`).join('');}
function renderSaves(){return heading('农场存档','把每一次收获好好保存。',button('存档文件夹','openFolder','','saves')+button('刷新','refresh'))+`<section class="panel list"><div class="list-header"><span>本地存档</span><span>${state.saves.length} 个</span></div>${state.saves.length?state.saves.map((save,index)=>`<div class="list-row"><div class="item-icon">${icon('saves')}</div><div class="item-main" title="${esc(save.directoryPath)}"><div class="item-name">${esc(save.name)}</div><div class="item-meta">最后保存 · ${formatDate(save.lastModified)}</div></div><div class="row-actions"><button class="button small soft" data-backup="${index}" ${busy?'disabled':''}>${icon('download')}备份</button></div></div>`).join(''):empty('你的农场还未出现在这里','在游戏中完成第一次保存后，存档会自动显示。','saves')}</section><div class="notice">${icon('about')}<span>请先在游戏中保存并退出，再创建备份。备份会保存为独立 ZIP 文件。</span></div>${backupPath?`<div class="backup-result">已备份至：${esc(backupPath)}</div><div class="toolbar" style="margin-top:12px">${button('备份文件夹','openFolder','','backups')}</div>`:''}`;}
function formatDate(value){const date=new Date(value);return isNaN(date)?'未记录':esc(date.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}));}
const isOffline=()=>!!state.content?.offline;
const targetGame=()=>isOffline()?(state.offlineGame||blank().offlineGame):{installation:state.installation,settings:state.settings,running:state.running};
const formValue=(form,name)=>String(new FormData(form).get(name)||'').trim();
function bytes(value){const n=Number(value)||0;return n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?Math.round(n/1024)+' KB':n+' B';}
function warnings(items){return items?.length?`<div class="warning-list"><ul>${items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`:'';}
function featureButton(text,action,attributes='',primary=false,disabled=false){return `<button class="button ${primary?'primary':''}" data-feature="${action}" type="button" ${attributes} ${busy||disabled?'disabled':''}>${esc(text)}</button>`;}

function renderProgress(){const node=document.getElementById('taskProgress');if(!node)return;if(!busy){node.innerHTML='';return;}const cancellable=['launch','launchOffline','guideSearch','guideArticle','multiplayerInstallCore','multiplayerCreate','multiplayerJoin','multiplayerRefresh','catalog','nexusCatalog','getNexusMod','downloadContent','downloadUrl','downloadNexus','downloadCommunity','downloadSmapi','analyzeLog','startNexusLogin','importOffline','exportOffline'].includes(activeTask);if(!cancellable){node.innerHTML='';return;}const phase=downloadProgress?.phase;const phaseLabel={launching:'正在等待游戏启动…',preparingMultiplayer:'正在准备联机核心…',connectingMultiplayer:'正在连接联机房间…',resolving:'正在查找下载文件…',downloading:'正在下载文件…',installing:'正在安装到当前游戏…',completed:'处理完成',fallback:'国内线路暂不可用，正在使用官方线路…',verifying:'正在校验官方 SHA-256…',extracting:'正在准备 SMAPI 安装文件…'}[phase];const fallback={launch:'正在等待游戏启动…',launchOffline:'正在等待游戏启动…',guideSearch:'正在搜索 BWIKI…',guideArticle:'正在读取图文攻略…',multiplayerInstallCore:'正在准备联机核心 · 首次下载约 31 MB…',multiplayerCreate:'正在创建联机房间…',multiplayerJoin:'正在连接房主…',multiplayerRefresh:'正在刷新联机连接…',catalog:'正在读取资源目录',nexusCatalog:'正在查询 N 网 API…',getNexusMod:'正在读取 N 网详情与文件…',downloadCommunity:'正在查找下载文件…',analyzeLog:'AI 正在分析脱敏快照',startNexusLogin:'等待浏览器完成 Nexus 登录',importOffline:'正在导入离线资源包',exportOffline:'正在准备离线资源包'}[activeTask]||'正在下载并检查资源';const percent=['resolving','installing','preparingMultiplayer','connectingMultiplayer'].includes(phase)?null:phase==='completed'?100:downloadProgress?.percent;const title=phaseLabel?phaseLabel+(downloadProgress?.name?' · '+downloadProgress.name:''):downloadProgress?.name||fallback;const transferred=downloadProgress&&(!phase||phase==='downloading')?` · ${bytes(downloadProgress.bytes)}${downloadProgress.total?' / '+bytes(downloadProgress.total):''}`:'';node.innerHTML=`<div class="progress-panel"><div class="progress-main"><div>${esc(title)}${transferred}</div><div class="progress-track ${percent==null?'indeterminate':''}"><span style="width function renderCommunity(){const downloaded=state.content?.downloads||[];const cachedIds=new Set(downloaded.map(d=>d.itemId));const all=catalog?.items||downloaded.map(d=>({id:d.itemId,name:d.name,version:d.version,description:'本机已下载，可离线安装。',source:'离线缓存',cached:true,canDownload:false,kind:'mod'}));for(const cached of downloaded)if(!all.some(item=>item.id===cached.itemId))all.push({id:cached.itemId,name:cached.name,version:cached.version,description:"本机已下载，可离线安装。",source:"离线缓存",cached:true,canDownload:false,kind:"mod"});const found=all.filter(item=>`${item.name} ${item.author||''} ${item.description||''}`.toLowerCase().includes(resourceSearch.toLowerCase()));return `<div class="source-cards">${[['3dm','3DM 星露谷社区','中文社区资源与攻略'],['smallfire','小火社区','星露谷模组与玩家交流'],['esous','ESOUS 社区','模组资源与社区分享']].map(([id,name,copy])=>`<section class="panel source-card"><h3>${name}</h3><p>${copy}</p>${featureButton('浏览器打开','openCommunity',`data-kind="${id}"`,false,isOffline())}</section>`).join('')}</div><div class="section-heading tight"><h2>作者资源与离线缓存</h2><label class="search">${icon('search')}<input id="resourceSearch" value="${esc(resourceSearch)}" placeholder="搜索资源" aria-label="搜索资源"></label></div>${catalog?warnings(catalog.warnings):'<p class="form-note" style="margin-bottom:13px">点击「刷新资源」读取作者公开发布的资源；社区资源也可通过订阅或直链添加。</p>'}<section class="panel list"><div class="list-header"><span>${isOffline()?'离线资源':'可用资源'}</span><span>${found.length} 项</span></div>${found.length?found.map(item=>{const cached=item.cached||cachedIds.has(item.id);const installReady=!!targetGame().installation?.hasGame;return `<div class="list-row resource-row"><div class="item-icon">${icon(item.kind==='pack'?'download':'mods')}</div><div class="item-main"><div class="item-name">${esc(item.name)}<span class="pill">${item.kind==='pack'?'整合包':'Mod'}</span>${cached?'<span class="pill green">已缓存</span>':''}</div><div class="item-meta">${esc(item.version||'以作者发布为准')}${item.author?' · '+esc(item.author):''} · ${esc(item.sou function renderNexusCatalog(){const result=nexusCatalog;return `<section class="panel panel-pad"><div class="setting-title">${icon('mods')}<h2>Nexus Mod 目录</h2></div><p class="detail-copy">直接使用 N 网 API，在软件中搜索、查看详情和文件。</p><form data-form="nexusCatalog"><div class="toolbar"><label class="field" style="min-width:145px">排序<select name="category">${[['latest_added','最新发布'],['latest_updated','最近更新'],['popular','热门下载']].map(([id,name])=>`<option value="${id}" ${nexusCategory===id?'selected':''}>${name}</option>`).join('')}</select></label><label class="field" style="flex:1">全站名称搜索<input name="query" value="${esc(nexusQuery)}" maxlength="120" placeholder="例如 Content Patcher，留空浏览列表" autocomplete="off"></label><button class="button primary" style="margin-top:23px" ${busy||isOffline()?'disabled':''}>${nexusQuery?'搜索':'加载目录'}</button></div></form><p class="form-note">搜索、详情和文件列表无需 API Key。Premium 可通过 API 直接下载；普通账户需原站授权 NXM。</p></section>${result?`<section class="panel list"><div class="list-header"><span>${result.query?'搜索：'+esc(result.query):'星露谷 Mod'}</span><span>第 ${Number(result.page)||1} 页 · ${Number(result.total)||0} 项</span></div>${result.items?.length?result.items.map(item=>`<div class="list-row resource-row"><div class="item-icon">${icon('mods')}</div><div class="item-main"><div class="item-name">${esc(item.name)}</div><div class="item-meta">${esc(item.author||'作者未标注')} · ${esc(item.version||'以发布为准')}${item.downloads?' · '+Number(item.downloads).toLocaleString('zh-CN')+' 次下载':''}</div><p class="resource-description">${esc(item.summary||'查看详情了解模组和文件。')}</p></div><div class="row-actions">${featureButton('详情与下载','nexusCatalogDetail',`data-mod-id="${Number(item.modId)}"`,true,isOffline())}</div></div>`).join(''):empty('没有匹配的 Mod','换个名称，或清空关键词查看最新列表。','mods')}</section><div class="toolbar">${featureButton('上一页','nexusCatalogPage',`data-result-page="${Math.max(1,Number(result.page)-1)}"`,false,isOffline()||Number(result.page)<=1)}${featureButton('下一页','nexusCatalogPage',`data-result-page="${Number(result.page)+1}"`,false,isOffline()||!result.hasMore)}<span class="small muted">${esc(result.notice||'')}</span></div>`:''}`;}
function renderNexusFiles(item){const account=state.nexus||{};return `${account.connected&&!account.isPremium&&!state.nxmRegistered?`<div class="info-strip">首次授权下载，请先注册 NXM 入口，让浏览器将文件交给星芽。${featureButton('注册 NXM 下载入口','registerNxm','',false,isOffline())}</div>`:''}${item.notice?`<p class="form-note">${esc(item.notice)}</p>`:''}<div class="list" style="margin-top:14px">${(item.files||[]).length?item.files.map(file=>{const active=file.available!==false,zip=file.isZip===true||file.canDownload===true;const attrs=`data-mod-id="${Number(item.modId)}" data-file-id="${Number(file.fileId)}"`;return `<div class="list-row" style="padding-left:0;padding-right:0"><div class="item-main"><div class="item-name">${esc(file.name)}</div><div class="item-meta">${esc(file.version||'')} · ${esc(file.categoryName||'')} · ${bytes(file.size)}${!active?' · 已归档或不可下载':!zip?' · 自动安装仅支持 ZIP':''}</div></div><div class="row-actions">${account.connected&&account.isPremium&&active&&zip?featureButton('下载','downloadNexus',attrs+' data-install="false"',false,isOffline())+featureButton('下载并安装','downloadNexus',attrs+' data-install="true"',true,isOffline()||!targetGame().installation?.hasGame||modsRunning()):active&&zip?account.connected?featureButton('官网授权下载','openNexusMod',attrs+' data-install="false"',false,isOffline()||!state.nxmRegistered)+featureButton('授权并安装','openNexusMod',attrs+' data-install="true"',true,isOffline()||!state.nxmRegistered||!targetGame().installation?.hasGame||modsRunning()):featureButton('连接下载账户','showNexusAccount','',false,isOffline()):''}</div></div>`;}).join(''):'<p class="muted small" style="padding:15px 0">没有可用文件。</p>'}</div>`;}

function renderNexus(){const account=state.nexus||{};const appId=nexusAppDraft??account.applicationId??'';return `<div class="settings-grid">${renderNexusCatalog()}<details><summary class="small muted" style="cursor:pointer">浏览器备用入口</summary><section class="panel panel-pad"><div class="setting-title">${icon('download')}<h2>从 N 网链接下载</h2></div><p class="detail-copy">粘贴星露谷 Mod 或文件链接，在系统默认浏览器中访问。</p><form data-form="openNexusLink"><label class="field">Nexus 链接或 Mod ID<input name="url" value="${esc(nexusLinkDraft)}" placeholder="https://www.nexusmods.com/stardewvalley/mods/…" required maxlength="2048" autocomplete="off"></label><div class="checkbox-row"><label><input type="checkbox" name="install" ${browserInstall?'checked':''} ${!targetGame().installation?.hasGame||modsRunning()?'disabled':''}>NXM 管理器下载后自动安装到当前游戏</label></div><button class="button primary" ${busy||isOffline()?'disabled':''}>在默认浏览器打开</button></form><p class="form-note">浏览器下载的 ZIP 可用「导入本地 ZIP」安装。已连接 API 账号并注册 NXM 后，浏览器的「Mod Manager Download」可交给星芽下载、校验与安装。</p></section></details><details id="nexusAccount"><summary class="small muted" style="cursor:pointer">Nexus 下载账户与 API Key</summary><section class="panel panel-pad" style="margin-top:12px"><div class="setting-title">${icon('about')}<h2>Nexus 账户</h2>${account.connected?`<span class="status-chip">${esc(account.username||'已连接')} · ${account.isPremium?'Premium':'普通账户'}</span>`:''}</div><p class="detail-copy">连接账户查询模组文件，或在默认浏览器登录原站下载。</p><div class="toolbar" style="margin-bottom:16px">${featureButton('浏览器打开 Nexus','openCommunity','data-kind="nexus"',false,isOffline())}</div><form data-form="saveNexusKey"><label class="field">Nexus API Key<input type="password" name="apiKey" placeholder="${account.hasApiKey?'已安全保存；填写新密钥可替换':'粘贴你的 Nexus 账户 API Key'}" autocomplete="new-password" required></label><div class="toolbar" style="margin-top:14px"><button class="button primary" ${busy||isOffline()?'disabled':''}>连接账户</button>${featureButton('断开连接','clearNexus','',false,!account.hasApiKey)}${featureButton('允许浏览器管理器下载','registerNxm')}</div></form><details style="margin-top:17px"><summary class="small muted" style="cursor:pointer">浏览器登录设置</summary><form data-form="saveNexusApplication"><label class="field" style="margin-top:14px">已注册的 Nexus 应用 ID<input name="applicationId" value="${esc(appId)}" placeholder="Nexus 批准注册的 application_id" autocomplete="off"></label><div class="toolbar" style="margin-top:14px"><button class="button" ${busy?'disabled':''}>保存应用 ID</button>${featureButton('在浏览器登录','startNexusLogin','',true,isOffline()||!account.applicationId)}</div></form><p class="form-note">Nexus SSO 需要已注册的应用 ID。也可在默认浏览器登录官网下载，或使用账户 API Key。</p></details><p class="form-note">Premium 账户可直接通过 API 下载；普通账户先打开 Mod 页面，点击「管理器下载」并由星芽接收。国内网络仍需能访问 Nexus 登录和文件服务。</p></section></details><section class="panel panel-pad"><div class="setting-title">${icon('mods')}<h2>Mod 详情与文件</h2></div><form data-form="getNexusMod"><div class="toolbar"><label class="field" style="flex:1">Mod ID 或 N 网链接<input name="modId" value="${esc(nexusModId)}" placeholder="输入 Mod ID，或粘贴星露谷 N 网链接" required></label><button class="button primary" style="margin-top:23px" ${busy||isOffline()?'disabled':''}>读取详情与文件</button>${featureButton('浏览器打开 Mod','openNexusMod','',false,isOffline()||!nexusModId)}</div></form>${nexusMod?`<div style="margin-top:20px"><h3>${esc(nexusMod.name)}</h3><p class="detail-copy">${esc(nexusMod.summary||'')}<br><span class="small muted">${esc(nexusMod.author||'')}</span></p>${renderNexusBrowseControls()}${renderNexusFiles(nexusMod)}</div>`:''}</section></div>`;}
function renderOffline(){const savedGame=state.offlineGame||blank().offlineGame;const game={...savedGame,settings:{...savedGame.settings,useSmapi:offlineModeDraft===null?!!savedGame.settings?.useSmapi:offlineModeDraft==="true"}};const installation=game.installation||{};const downloads=state.content?.downloads||[];return heading('离线模式','独立游戏目录，带上缓存资源就能出发。')+`<div class="offline-layout"><div class="settings-grid"><section class="panel panel-pad"><div class="setting-title">${icon('offline')}<h2>离线状态</h2></div><div class="offline-state"><div><h3>${isOffline()?'已进入离线模式':'当前允许联网'}</h3><p>${isOffline()?'网络下载、Nexus 和 AI 发送已暂停；本地启动与缓存安装仍可使用。':'联网时准备资源，再切换到离线模式使用。'}</p></div><button class="toggle ${isOffline()?'on':''}" data-feature="setOffline" role="switch" aria-checked="${isOffline()}" aria-label="离线模式" ${busy?'disabled':''}></button></div></section><section class="panel panel-pad"><div class="setting-title">${icon('folder')}<h2>本地离线游戏</h2>${installation.hasGame?'<span class="status-chip">已配置</span>':''}</div><p class="detail-copy">选择你已有的本地星露谷物语游戏目录，支持原版或 SMAPI / Mod。此目录与游戏库单独保存。</p><div class="path-field" title="${esc(game.settings?.gameDirectory)}">${esc(game.settings?.gameDirectory||'选择本地游戏目录')}</div><div class="toolbar">${featureButton('选择本地游戏目录','chooseOfflineGame','',true)}</div><div class="hero-footer" style="margin-top:18px;padding-top:0"><select class="mode-select" id="offlineMode" aria-label="离线启动模式" ${busy?'disabled':''}><option value="false" ${!game.settings?.useSmapi?'selected':''}>原版游戏</option><option value="true" ${game.settings?.useSmapi?'selected':''}>SMAPI / Mod</option></select>${featureButton(game.running?'游戏运行中':'启动离线游戏','launchOffline','',true,!installation.hasGame||!!game.running)}</div><p class="form-note">${installation.hasGame?'游戏版本 '+version(installation.gameVersion)+' · '+(installation.hasSmapi?'SMAPI '+version(installation.smapiVersion):'未检测到 SMAPI'):'请选择包含 Stardew Valley.exe 的游戏文件夹。'}</p></section><section class="panel panel-pad"><div class="setting-title">${icon('download')}<h2>携带离线资源</h2></div><p class="detail-copy">将已缓存的 Mod 与整合包导出，在无网络的电脑上导入。资源包包含模组，不包含游戏本体。</p><div class="toolbar">${featureButton('导出离线资源包','exportOffline','',false,!downloads.length)}${featureButton('导入离线资源包','importOffline')}</div></section></div><section class="panel panel-pad"><div class="setting-title">${icon('mods')}<h2>本机资源缓存</h2><span class="muted small">${downloads.length} 项</span></div><p class="form-note" style="margin-bottom:13px">安装目标：${isOffline()?'本地离线游戏目录':'游戏库目录'}。切换离线模式可使用独立目录。</p>${downloads.length?downloads.map(item=>`<div class="cache-item"><div class="item-main"><h3>${esc(item.name)}</h3><p>${esc(item.version||'版本未标注')} · ${bytes(item.size)}</p></div>${featureButton('安装','installCached',`data-item-id="${esc(item.itemId)}"`,false,!targetGame().installation?.hasGame)}</div>`).join(''):empty('缓存还是空的','在资源中心下载 Mod，或导入已有离线资源包。','download')}<div class="toolbar" style="margin-top:16px"><button class="button soft" data-go="downloads">前往资源中心</button>${button('导入本地 Mod ZIP','importMod')}</div></section></div>`;}
function renderCommunityDirectory(){const result=communityCatalog;return `<section class="panel panel-pad"><div class="setting-title">${icon('mods')}<h2>社区资源目录</h2></div><form data-form="communityList"><div class="toolbar"><label class="field" style="min-width:145px">来源<select name="source" id="communitySource"><option value="3dm" ${communitySource==='3dm'?'selected':''}>3DM</option><option value="smallfire" ${communitySource==='smallfire'?'selected':''}>小火社区</option></select></label><label class="field" style="flex:1">搜索<input name="query" value="${esc(communityQuery)}" placeholder="Mod、整合包或作者" autocomplete="off"></label><button class="button primary" style="margin-top:23px" ${busy||isOffline()?'disabled':''}>加载目录</button>${featureButton('浏览器打开','openCommunity',`data-kind="${communitySource}"`,false,isOffline())}</div></form><p class="form-note">3DM 可直接下载安装，自动查找文件并安装到当前游戏。其他链接可查看详情。</p></section>${warnings(result?.warnings)}<section class="panel list" style="margin-top:17px"><div class="list-header"><span>${communitySource==='3dm'?'3DM':'小火社区'}</span><span>${result?.items?.length||0} 项</span></div>${result?.items?.length?result.items.map(item=>`<div class="list-row resource-row"><div class="item-icon">${icon('mods')}</div><div class="item-main"><div class="item-name">${esc(item.name)}</div><div class="item-meta">${esc(item.author||'社区作者')}${item.version?' · '+esc(item.version):''}</div><p class="resource-description">${esc(item.summary||'查看详情了解内容和下载方式。')}</p></div><div class="row-actions">${communityDownloadActions(item)}${featureButton('详情','communityDetail',`data-source="${communitySource}" data-item-id="${esc(item.id)}"`,false,isOffline())}${featureButton('浏览器打开','openCommunity',`data-kind="${communitySource}" data-item-id="${esc(item.id)}"`,false,isOffline())}</div></div>`).join(''):empty(result?'没有匹配的资源':'加载社区目录',isOffline()?'离线时可使用作者与缓存中的资源。':'选择来源并点击加载目录，支持在软件内查看详情。','mods')}</section>${result?`<div class="toolbar" style="margin-top:16px">${featureButton('上一页','communityPage',`data-result-page="${Math.max(1,communityPage-1)}"`,false,isOffline()||communityPage<=1)}<span class="small muted">第 ${communityPage} 页</span>${featureButton('下一页','communityPage',`data-result-page="${communityPage+1}"`,false,isOffline()||!result.hasMore)}</div>`:''}`;}
function renderAppearance(){const value=appearanceValues();const themes=[['light','浅色'],['dark','深色'],['oled','OLED 纯黑'],['system','跟随系统']];const accents=['#5588eb','#7469cf','#cb759f','#cb8a5d','#49a986','#379ca6','#8d719c','#ad7979'];const range=(name,label,min,max,unit)=>`<label class="field"><span class="range-label">${label}<span id="${name}Value">${Number(value[name])}${unit}</span></span><input type="range" name="${name}" min="${min}" max="${max}" value="${Number(value[name])}" aria-label="${label}"></label>`;return heading('外观设置','圆润毛玻璃，按你的喜好调整。')+`<form data-form="saveAppearance"><input type="hidden" name="theme" value="${esc(value.theme)}"><div class="settings-grid"><section class="panel panel-pad"><div class="setting-title">${icon('appearance')}<h2>主题与颜色</h2></div><div class="appearance-themes">${themes.map(([id,label])=>`<button type="button" class="theme-choice ${value.theme===id?'selected':''}" data-feature="appearanceTheme" data-theme-choice="${id}" ${busy?'disabled':''}><div class="theme-mini ${id}"></div><span>${label}</span></button>`).join('')}</div><div class="fields"><label class="field">强调色<input type="color" name="accent" value="${esc(/^#[a-f0-9]{6}$/i.test(value.accent)?value.accent:defaultAppearance.accent)}" aria-label="自定义强调色"></label><div><p class="field-label">预设颜色</p><div class="accent-presets">${accents.map(accent=>`<button type="button" class="accent-swatch ${value.accent===accent?'selected':''}" style="background:${accent}" data-feature="appearanceAccent" data-accent="${accent}" aria-label="强调色 ${accent}" ${busy?'disabled':''}></button>`).join('')}</div></div></div></section><section class="panel panel-pad"><div class="setting-title">${icon('folder')}<h2>背景与透明度</h2></div><div class="toolbar">${featureButton('选择背景图片','chooseBackground')}${featureButton('清除图片','clearBackground','',false,!state.appearance?.hasBackground)}</div><p class="background-name">${esc(state.appearance?.backgroundName||'默认：淡粉、米色与淡蓝薄雾')}</p><div class="appearance- function sanitizeGuideHtml(value){
  // Templates parse inertly: no image requests, scripts, events or custom elements run before filtering.
  const template=document.createElement('template');template.innerHTML=String(value||'').slice(0,2000000);
  const allowed=new Set(['p','div','span','h1','h2','h3','h4','h5','h6','ul','ol','li','dl','dt','dd','table','thead','tbody','tfoot','tr','th','td','caption','colgroup','col','b','strong','i','em','small','sub','sup','s','del','u','br','hr','blockquote','pre','code','figure','figcaption','a','img']);
  const forbidden=new Set(['script','style','iframe','object','embed','svg','math','form','input','button','textarea','select','option','link','meta','base','template','noscript','audio','video','source','picture']);
  let visited=0;
  function walk(node,depth){
    if(++visited>60000||depth>80)return '';
    if(node.nodeType===3)return esc(node.textContent);if(node.nodeType!==1)return '';
    const tag=String(node.tagName||'').toLowerCase();if(forbidden.has(tag))return '';
    const children=()=>Array.from(node.childNodes||[]).map(child=>walk(child,depth+1)).join('');
    if(!allowed.has(tag))return children();
    if(tag==='img'){const src=guideImageProxy(node.getAttribute('src'));if(!src)return '';const alt=String(node.getAttribute('alt')||'攻略图片').slice(0,240);const width=Number(node.getAttribute('width'));return `<img src="${esc(src)}" alt="${esc(alt)}" data-guide-image="true" loading="lazy" decoding="async" referrerpolicy="no-referrer" title="点击放大图片"${Number.isInteger(width)&&width>0&&width<=3000?' width="'+width+'"':''}>`;}
    if(tag==='a'){const link=safeGuideLink(node.getAttribute('href'));const text=children();return link?`<a href="#" data-guide-title="${esc(link.title)}"${link.anchor?' data-guide-anchor="'+esc(link.anchor)+'"':''}>${text}</a>`:text;}
    let attributes='';const id=node.getAttribute('id');if(id&&id.length<300)attributes+=' id="'+esc(guideAnchorId(id))+'"';
    if(['td','th','col','colgroup'].includes(tag)){for(const name of ['colspan','rowspan','span']){const count=Number(node.getAttribute(name));if(Number.isInteger(count)&&count>0&&count<=100)attributes+=' '+name+'="'+count+'"';}}
    if(['br','hr','col'].includes(tag))return '<'+tag+attributes+'>';
    return '<'+tag+attributes+'>'+children()+'</'+tag+'>';
  }
  return Array.from(template.content.childNodes).map(node=>walk(node,0)).join('');
}

  if(action==='multiplayerCreate'||action==='multiplayerJoin'){
    if(!state.multiplayer?.coreInstalled){toast('请先安装联机核心。',true);return;}
    if(state.multiplayer?.running){toast('请先退出当前联机，再切换房间。',true);return;}
    const nickname=formValue(form,'nickname');
    if(action==='multiplayerCreate'){multiplayerHostNickname=nickname;await operate(action,{nickname});return;}
    const code=formValue(form,'code');multiplayerGuestNickname=nickname;multiplayerCode=code;
    if(code.length<10||code.length>2048||!/^SG1\.[A-Za-z0-9_-]+$/.test(code)){toast(code.startsWith('U/')?'陶瓦邀请码不能用于星露谷，请向房主要 SG1 星芽邀请码。':'请粘贴完整的 SG1 星芽联机邀请码。',true);return;}
    await operate(action,{code,nickname});return;
  }
  if(action==='guideSearch'){guideQuery=formValue(form,'query').trim();await searchGuides(1);return;}
  if(action==='saveAppearance'){const payload=readAppearanceForm(form);const result=await operate(action,payload,'外观已保存。');if(result){appearanceDraft=null;render();}return;}
  if(action==='nexusCatalog'){nexusCategory=formValue(form,'category')||'latest_added';nexusQuery=formValue(form,'query');await loadNexusCatalog(1);return;}
  if(action==='communityList'){communitySource=formValue(form,'source')||'3dm';communityQuery=formValue(form,'query');await loadCommunity(1);return;}
  if(action==='saveAnalysis'){
    const payload={...readAIForm(form),apiKey:formValue(form,'apiKey')||null};if(aiEditingNew)payload.profileId='';else if(state.analysis?.activeProfileId)payload.profileId=state.analysis.activeProfileId;
    invalidateAI();const result=await operate(action,payload,'AI 连接与筛选设置已保存。');if(result){aiDraft=null;aiEditingNew=false;if(result.endpoint!==undefined)state.analysis=result;render();}return;
  }
  if(action==='addFeed'){const result=await operate(action,{url:formValue(form,'url')},'社区订阅已添加。');if(result&&!isOffline())await loadCatalog();return;}
  if(action==='downloadUrl'){await operate(action,{url:formValue(form,'url'),sha256:formValue(form,'sha256'),install:form.elements.install.checked},'ZIP 已下载并检查，资源列表已更新。');catalog=null;render();return;}
  if(action==='openNexusLink'){nexusLinkDraft=formValue(form,'url');browserInstall=!!form.elements.install.checked;await operate(action,{url:nexusLinkDraft,install:browserInstall&&!!targetGame().installation?.hasGame&&!modsRunning()});return;}
  if(action==='downloadSmapi'){await operate(action,{source:formValue(form,'source')||'domestic'});return;}
  if(action==='saveNexusKey'){await operate(action,{apiKey:formValue(form,'apiKey')},'Nexus 账户已连接。');return;}
  if(action==='saveNexusApplication'){const result=await operate(action,{applicationId:formValue(form,'applicationId')},'Nexus 应用 ID 已保存。');if(result){nexusAppDraft=null;render();}return;}
  if(action==='getNexusMod'){const value=formValue(form,'modId');if(!value)return;nexusModId=value;const id=/^[1-9][0-9]{0,8}$/.test(value)?Number(value):null;await showNexusMod(id?{modId:id}:{url:value});return;}
});
document.addEventListener('input',event=>{
  if(event.target.id==='guideQuery'){guideQuery=event.target.value;return;}
  if(event.target.id==='hostNickname'){multiplayerHostNickname=event.target.value;return;}
  if(event.target.id==='guestNickname'){multiplayerGuestNickname=event.target.value;return;}
  if(event.target.id==='multiplayerCode'){multiplayerCode=event.target.value;return;}
  const target=event.target;
  if(target.id==='resourceSearch'){const caret=target.selectionStart;resourceSearch=target.value;render();const replacement=document.getElementById('resourceSearch');replacement?.focus();replacement?.setSelectionRange(caret,caret);return;}
  const form=target.closest('form[data-form]');
  if(form?.dataset.form==='saveAppearance'){appearanceDraft=readAppearanceForm(form);applyAppearance();for(const name of ['blur','opacity','panelOpacity']){const output=document.getElementById(name+'Value');if(output)output.textContent=Number(appearanceDraft[name])+(name==='blur'?' px':'%');}const discard=document.querySelector('[data-feature="discardAppearance"]');if(discard)discard.disabled=busy;return;}
  if(form?.dataset.form==='openNexusLink'&&target.name==='url')nexusLinkDraft=target.value;
  if(form?.dataset.form==='getNexusMod'&&target.name==='modId'){nexusModId=target.value;const external=form.querySelector('[data-feature="openNexusMod"]');if(external)external.disabled=busy||isOffline()||!/^[1-9][0-9]{0,8}$/.test(nexusModId);}
  if(form?.dataset.form==='saveNexusApplication'&&target.name==='applicationId')nexusAppDraft=target.value;
  if(form?.dataset.form==='saveAnalysis'){
    aiDraft=readAIForm(form);invalidateAI();const modelsButton=document.querySelector('[data-feature="analysisModels"]');if(modelsButton)modelsButton.disabled=true;const previewButton=document.querySelector('[data-feature="analysisPreview"]');if(previewButton)previewButton.disabled=true;
  }
});
document.addEventListener('change',async event=>{
  const target=event.target;if(target.id==='offlineMode')offlineModeDraft=target.value;
  if(target.id==='browserInstall'){browserInstall=target.checked;return;}
  if(target.dataset?.modSelect!==undefined){if(busy||modsRunning())return;const mod=state.mods[Number(target.dataset.modSelect)];if(mod){if(target.checked)selectedMods.add(mod.directoryPath);else selectedMods.delete(mod.directoryPath);render();}return;}
  if(target.id==='modSelectAll'){if(busy||modsRunning())return;for(const {mod} of visibleMods()){if(target.checked)selectedMods.add(mod.directoryPath);else selectedMods.delete(mod.directoryPath);}render();return;}
  if(target.id==='communitySource'){communitySource=target.value;communityCatalog=null;communityPage=1;return;}
  if(target.id==='analysisProfile'&&!busy&&target.value&&target.value!==state.analysis?.activeProfileId){aiDraft=null;aiEditingNew=false;aiModels=[];invalidateAI();const result=await operate('selectAnalysisProfile',{profileId:target.value});if(result?.endpoint!==undefined)state.analysis=result;render();return;}
  if(target.id==='analysisProvider'){const form=target.closest('form[data-form]');aiDraft=readAIForm(form);aiDraft.endpoint=aiProviders[target.value]?.[1]||'';aiDraft.model='';aiDraft.allowLocalHttp=target.value==='ollama';aiModels=[];invalidateAI();render();return;}
  if(target.id==='analysisModelSelect'&&target.value){const form=target.closest('form[data-form]');form.elements.model.value=target.value;aiDraft=readAIForm(form);invalidateAI();const modelsButton=document.querySelector('[data-feature="analysisModels"]');if(modelsButton)modelsButton.disabled=true;return;}
  if(target.id==='aiConsent'){aiConfirm=target.checked;const send=document.getElementById('analyzeButton');if(send)send.disabled=busy||isOffline()||!state.analysis?.endpoint||!aiConfirm||!aiPreview||!!aiDraft||aiEditingNew;}
});
document.getElementById('dragRegion').addEventListener('pointerdown',event=>{if(event.button===0&&event.detail<2&&!event.target.closest('button,select,input')){event.preventDefault();rpc('drag').catch(()=>{});}});
document.getElementById('dragRegion').addEventListener('dblclick',event=>{if(!event.target.closest('button,select,input')){event.preventDefault();rpc('maximize').catch(()=>{});}});
document.addEventListener('click',async event=>{
  // Wiki thumbnails are often wrapped in file-page links; opening the image takes precedence.
  const image=event.target.closest('.guide-body img[data-guide-image]');
  if(image){event.preventDefault();try{const proxy=new URL(image.getAttribute('src'));if(proxy.hostname!=='guides.starsprout.local'||proxy.pathname!=='/image')return;const canonical=safeGuideImage(proxy.searchParams.get('url'));if(!canonical)return;guideImage={url:canonical,alt:image.getAttribute('alt')||'攻略图片'};guideImageMode='fit';guideImageScale=100;renderGuideImage();}catch{}return;}
  const link=event.target.closest('.guide-body [data-guide-title]');
  if(link){event.preventDefault();if(busy)return;const title=link.dataset.guideTitle;const anchor=link.dataset.guideAnchor||'';if(title===guideArticle?.title&&anchor){document.getElementById(guideAnchorId(anchor))?.scrollIntoView?.({behavior:'smooth',block:'start'});}else await loadGuideArticle(title,anchor);}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&guideImage){guideImage=null;renderGuideImage();return;}if(event.key==='Escape'&&detailItem){detailItem=null;renderDetail();}});
render();refresh();setInterval(()=>{if(!busy&&!document.hidden&&page!=='about')refresh(true);},12000);
</script>
</body>
</html>
