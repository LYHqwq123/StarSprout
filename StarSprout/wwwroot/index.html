function applyAppearance(){
  const value=appearanceValues();const theme=['light','dark','oled','system'].includes(value.theme)?value.theme:'light';

  const accent=/^#[a-f0-9]{6}$/i.test(value.accent)?value.accent:defaultAppearance.accent;const rgb=[1,3,5].map(i=>parseInt(accent.slice(i,i+2),16)).join(',');

const pending=new Map();
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function rpc(action,payload={}){return new Promise((resolve,reject)=>{if(!window.chrome?.webview){reject(new Error('请在星芽启动器中打开此页面。'));return;}const id=++serial;const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('等待超时，可取消当前任务或稍后刷新。'));},action.startsWith('download')||action==='startNexusLogin'?1200000:180000);pending.set(id,{resolve,reject,timeout});window.chrome.webview.postMessage({id,action,payload});});}

${state.launchWarning?warnings([state.launchWarning]):''}${renderCalendar()}<div class="section-heading"><h2>游戏概览</h2><span>来自你的本地游戏</span></div><div class="stats"><div class="panel stat"><div class="stat-icon">${icon('mods')}</div><div><div class="stat-label">已安装 Mod</div><div class="stat-value">${loading?'—':state.mods.length}<span class="small"> 个</span></div><div class="stat-detail">${loading?'正在扫描':enabled+' 个已启用'}</div></div></div><div class="panel stat"><div class="stat-icon">${icon('saves')}</div><div><div class="stat-label">本地存档</div><div class="stat-value">${loading?'—':state.saves.length}<span class="small"> 个</span></div><div class="stat-detail">随时备份你的农场</div></div></div><div class="panel stat"><div class="stat-icon">${icon('download')}</div><div style="min-width:0"><div class="stat-label">游戏版本</div><div class="stat-value" title="${esc(installation.gameVersion)}">${loading?'—':ready?version(installation.gameVersion):'未配置'}</div><div class="stat-detail">${installation.hasSmapi?'SMAPI '+version(installation.smapiVersion):'SMAPI 未安装'}</div></div></div></div>
<div class="section-heading"><h2>快速访问</h2></div><div class="quick-grid"><button class="panel quick-card" data-go="mods">${icon('mods')}<div><strong>管理你的 Mod</strong><p>安装、启停与依赖检查</p></div>${icon('arrow')}</button><button class="panel quick-card" data-go="saves">${icon('saves')}<div><strong>农场存档</strong><p>为珍贵的进度留一份备份</p></div>${icon('arrow')}</button><button class="panel quick-card" data-action="openFolder" data-kind="game">${icon('folder')}<div><strong>游戏文件夹</strong><p>浏览本地游戏文件</p></div>${icon('arrow')}</button></div>`;}
function safeHomeImage(value){try{const url=new URL(value);return url.protocol==='https:'&&url.hostname==='home.starsprout.local'&&url.pathname==='/background.png'&&!url.port&&!url.username&&!url.password?url.href:'';}catch{return '';}}
function homeMonthValues(){const now=new Date();return {year:Number(state.home?.year)||now.getFullYear(),month:Number(state.home?.month)||now.getMonth()+1};}
function renderCalendar(){const {year,month}=homeMonthValues();const now=new Date();const today=state.home?.today||`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const first=new Date(year,month-1,1),offset=(first.getDay()+6)%7,total=new Date(year,month,0).getDate();const days=new Map((state.home?.days||[]).map(day=>[day.date,day]));const cells=Array.from({length:offset},()=>'<span class="calendar-cell" aria-hidden="true"></span>');for(let day=1;day<=total;day++){const date=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`,record=days.get(date),accent=/^#[a-fA-F0-9]{6}$/.test(record?.accent)?record.accent:'#5488ee';cells.push(`<div class="calendar-cell"><span class="calendar-date ${record?'played':''} ${today===date?'today':''}" ${record?`style="--day-accent:${accent}"`:''} title="${esc(date+(record?' · 启动 '+Number(record.count||1)+' 次':' · 未记录启动'))}" aria-label="${esc(date+(record?' 已启动游戏':''))}">${day}</span></div>`);}return `<section class="panel home-calendar"><div class="calendar-header"><h2>启动日历</h2><div class="calendar-nav">${featureButton('‹','calendarMonth','data-step="-1"',false,year<=1970&&month===1)}<strong>${year} 年 ${month} 月</strong>${featureButton('›','calendarMonth','data-step="1"',false,year>=2100&&month===12)}${featureButton('本月','homeToday')}</div></div><div class="calendar-grid">${['一','二','三','四','五','六','日'].map(day=>`<span class="calendar-week">${day}</span>`).join('')}${cells.join('')}</div><p class="calendar-note">成功启动游戏的日期，用当次主题颜色圈出。</p></section>`;}
function modsRunning(){return !!state.running||!!targetGame().running;}
function visibleMods(){return state.mods.map((mod,index)=>({mod,index})).filter(({mod})=>`${mod.name} ${mod.author} ${mod.uniqueId}`.toLowerCase().includes(modSearch.toLowerCase()));}
function renderMods(){const locked=modsRunning();const found=visibleMods();return heading('Mod 管理',locked?'游戏运行中，请退出游戏后调整 Mod。':'选择一组 Mod，快速禁用并排查冲突。',`<label class="search">${icon('search')}<input id="modSearch" aria-label="搜索 Mod" placeholder="搜索名称或作者" value="${esc(modSearch)}"></label>`+button('导入 ZIP','importMod','primary'))+`<div class="panel mod-tools"><label class="selection"><input class="mod-check" type="checkbox" id="modSelectAll" ${found.length&&found.every(({mod})=>selectedMods.has(mod.directoryPath))?'checked':''} ${busy||locked?'disabled':''}>全选当前列表</label><span class="small muted">已选 ${selectedMods.size} 个</span>${featureButton('禁用所选','setModsEnabled','data-enabled="false"',false,locked||!selectedMods.size)}${featureButton('启用所选','setModsEnabled','data-enabled="true"',false,locked||!selectedMods.size)}${featureButton('禁用全部','disableAllMods','',false,locked||!state.mods.some(mod=>mod.enabled))}${featureButton('恢复上次组合','restoreModState','',false,locked||!state.modTroubleshooting?.canRestore)}${selectedMods.size?featureButton('清空选择','clearModSelection'):''}</div><section class="panel list"><div class="list-header"><span>已安装的 Mod</span><span>${state.mods.length} 个 · ${state.mods.filter(mod=>!mod.enabled).length} 个已禁用</span></div><div id="modRows">${modRows()}</div></section><div class="notice">${icon('about')}<span>禁用只调整文件夹状态；恢复上次组合可撤回最近一次批量调整。</span></div><div class="toolbar">${button('刷新列表','refresh')}${button('Mods 文件夹','openFolder','','mods')}${button('已删除 Mod 副本','openFolder','','removedMods')}</div>`;}
function modRows(){const found=visibleMods();const locked=busy||modsRunning();if(!found.length)return empty(modSearch?'没有匹配的 Mod':'还没有安装 Mod',modSearch?'换个关键词再试试。':'导入作者提供的 ZIP，或到资源中心选择 Mod。','mods');return found.map(({mod,index})=>`<div class="list-row"><input class="mod-check" type="checkbox" data-mod-select="${index}" aria-label="选择 ${esc(mod.name)}" ${selectedMods.has(mod.directoryPath)?'checked':''} ${locked?'disabled':''}><div class="item-icon">${icon('mods')}</div><div class="item-main" title="${esc(mod.uniqueId+'\n'+mod.directoryPath)}"><div class="item-name">${esc(mod.name)}</div><div class="item-meta">${esc(mod.version||'未知版本')} · ${esc(mod.author||'未知作者')} · ${mod.enabled?'已启用':'已禁用'}</div>${mod.status&& !['可用','已停用','已禁用'].includes(mod.status)?`<div class="dependency">${esc(mod.status)}</div>`:''}</div><div class="row-actions"><button type="button" class="button small danger" data-feature="removeMod" data-mod-index="${index}" ${locked?'disabled':''}>删除</button><button type="button" class="button small ${mod.enabled?'':'soft'}" data-toggle="${index}" ${locked?'disabled':''}>${mod.enabled?'禁用':'启用'}</button><button type="button" class="toggle ${mod.enabled?'on':''}" role="switch" aria-checked="${!!mod.enabled}" aria-label="${mod.enabled?'禁用':'启用'} ${esc(mod.name)}" title="${mod.enabled?'禁用':'启用'}" data-toggle="${index}" ${locked?'disabled':''}></button></div></div>`).join('');}
function renderSaves(){return heading('农场存档','把每一次收获好好保存。',button('存档文件夹','openFolder','','saves')+button('刷新','refresh'))+`<section class="panel list"><div class="list-header"><span>本地存档</span><span>${state.saves.length} 个</span></div>${state.saves.length?state.saves.map((save,index)=>`<div class="list-row"><div class="item-icon">${icon('saves')}</div><div class="item-main" title="${esc(save.directoryPath)}"><div class="item-name">${esc(save.name)}</div><div class="item-meta">最后保存 · ${formatDate(save.lastModified)}</div></div><div class="row-actions"><button class="button small soft" data-backup="${index}" ${busy?'disabled':''}>${icon('download')}备份</button></div></div>`).join(''):empty('你的农场还未出现在这里','在游戏中完成第一次保存后，存档会自动显示。','saves')}</section><div class="notice">${icon('about')}<span>请先在游戏中保存并退出，再创建备份。备份会保存为独立 ZIP 文件。</span></div>${backupPath?`<div class="backup-result">已备份至：${esc(backupPath)}</div><div class="toolbar" style="margin-top:12px">${button('备份文件夹','openFolder','','backups')}</div>`:''}`;}
function formatDate(value){const date=new Date(value);return isNaN(date)?'未记录':esc(date.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}));}

function bytes(value){const n=Number(value)||0;return n>=1073741824?(n/1073741824).toFixed(2)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?Math.round(n/1024)+' KB':n+' B';}

function renderProgress(){const node=document.getElementById('taskProgress');if(!node)return;if(!busy){node.innerHTML='';return;}const cancellable=['catalog','downloadContent','downloadUrl','downloadNexus','downloadCommunity','downloadSmapi','analyzeLog','startNexusLogin','importOffline','exportOffline'].includes(activeTask);if(!cancellable){node.innerHTML='';return;}const phase=downloadProgress?.phase;const phaseLabel={resolving:'正在查找下载文件…',downloading:'正在下载文件…',installing:'正在安装到当前游戏…',completed:'处理完成',fallback:'国内线路暂不可用，正在使用官方线路…',verifying:'正在校验官方 SHA-256…',extracting:'正在准备 SMAPI 安装文件…'}[phase];const fallback={catalog:'正在读取资源目录',downloadCommunity:'正在查找下载文件…',analyzeLog:'AI 正在分析脱敏快照',startNexusLogin:'等待浏览器完成 Nexus 登录',importOffline:'正在导入离线资源包',exportOffline:'正在准备离线资源包'}[activeTask]||'正在下载并检查资源';const percent=phase==='resolving'||phase==='installing'?null:phase==='completed'?100:downloadProgress?.percent;const title=phaseLabel?phaseLabel+(downloadProgress?.name?' · '+downloadProgress.name:''):downloadProgress?.name||fallback;const transferred=downloadProgress&&(!phase||phase==='downloading')?` · ${bytes(downloadProgress.bytes)}${downloadProgress.total?' / '+bytes(downloadProgress.total):''}`:'';node.innerHTML=`<div class="progress-panel"><div class="progress-main"><div>${esc(title)}${transferred}</div><div class="progress-track ${percent==null?'indeterminate':''}"><span style="width:${percent==null?35:Math.max(0,Math.min(100,Number(percent)))}%"></span></div></div><button type="button" class="button small" data-feature="cancelTask">取消</button></div>`;}
function renderResources(){return heading('资源中心','在软件里发现资源、查看详情与下载。',featureButton('刷新资源','loadCatalog','',false,isOffline())+button('导入本地 ZIP','importMod'))+targetNotice()+`<div class="tabs" role="tablist">${[['community','作者与缓存'],['directory','社区目录'],['nexus','Nexus Mods'],['sources','订阅与直链']].map(([id,label])=>`<button type="button" class="tab ${resourceTab===id?'active':''}" data-resource-tab="${id}" role="tab" aria-selected="${resourceTab===id}">${label}</button>`).join('')}</div>${resourceTab==='directory'?renderCommunityDirectory():resourceTab==='nexus'?renderNexus():resourceTab==='sources'?renderSources():renderCommunity()}`;}
function renderCommunity(){const downloaded=state.content?.downloads||[];const cachedIds=new Set(downloaded.map(d=>d.itemId));const all=catalog?.items||downloaded.map(d=>({id:d.itemId,name:d.name,version:d.version,description:'本机已下载，可离线安装。',source:'离线缓存',cached:true,canDownload:false,kind:'mod'}));for(const cached of downloaded)if(!all.some(item=>item.id===cached.itemId))all.push({id:cached.itemId,name:cached.name,version:cached.version,description:"本机已下载，可离线安装。",source:"离线缓存",cached:true,canDownload:false,kind:"mod"});const found=all.filter(item=>`${item.name} ${item.author||''} ${item.description||''}`.toLowerCase().includes(resourceSearch.toLowerCase()));return `<div class="source-cards">${[['3dm','3DM 星露谷社区','中文社区资源与攻略'],['smallfire','小火社区','星露谷模组与玩家交流'],['esous','ESOUS 社区','模组资源与社区分享']].map(([id,name,copy])=>`<section class="panel source-card"><h3>${name}</h3><p>${copy}</p>${featureButton('浏览器打开','openCommunity',`data-kind="${id}"`,false,isOffline())}</section>`).join('')}</div><div class="section-heading tight"><h2>作者资源与离线缓存</h2><label class="search">${icon('search')}<input id="resourceSearch" value="${esc(resourceSearch)}" placeholder="搜索资源" aria-label="搜索资源"></label></div>${catalog?warnings(catalog.warnings):'<p class="form-note" style="margin-bottom:13px">点击「刷新资源」读取作者公开发布的资源；社区资源也可通过订阅或直链添加。</p>'}<section class="panel list"><div class="list-header"><span>${isOffline()?'离线资源':'可用资源'}</span><span>${found.length} 项</span></div>${found.length?found.map(item=>{const cached=item.cached||cachedIds.has(item.id);const installReady=!!targetGame().installation?.hasGame;return `<div class="list-row resource-row"><div class="item-icon">${icon(item.kind==='pack'?'download':'mods')}</div><div class="item-main"><div class="item-name">${esc(item.name)}<span class="pill">${item.kind==='pack'?'整合包':'Mod'}</span>${cached?'<span class="pill green">已缓存</span>':''}</div><div class="item-meta">${esc(item.version||'以作者发布为准')}${item.author?' · '+esc(item.author):''} · ${esc(item.source||'作者公开来源')}</div><p class="resource-description">${esc(item.description||'查看作者页面了解版本和依赖说明。')}</p></div><div class="row-actions">${featureButton('详情','contentDetail',`data-item-id="${esc(item.id)}"`)}${item.sourceUrl?featureButton('浏览器打开','openContentSource',`data-item-id="${esc(item.id)}"`,false,isOffline()):''}${cached?featureButton('安装缓存','installCached',`data-item-id="${esc(item.id)}"`,true,!installReady):item.canDownload?featureButton('下载','downloadContent',`data-item-id="${esc(item.id)}" data-install="false"`,false,isOffline())+featureButton('下载并安装','downloadContent',`data-item-id="${esc(item.id)}" data-install="true"`,true,isOffline()||!installReady):'<span class="muted small">前往社区获取下载地址</span>'}</div></div>`;}).join(''):empty(isOffline()?'还没有离线资源':'等待发现资源',isOffline()?'导入离线资源包，或在联网时预先下载。':'刷新目录，或添加社区订阅与作者 ZIP 直链。','download')}</section><p class="form-note">社区与作者原站使用系统默认浏览器打开。公开 ZIP 可直接下载，网页登录及网盘下载在浏览器中继续。</p>`;}

document.addEventListener('click',async event=>{const navigation=event.target.closest('[data-page],[data-go]');if(navigation){navigate(navigation.dataset.page||navigation.dataset.go);return;}const toggle=event.target.closest('[data-toggle]');if(toggle&&!toggle.disabled&&!busy&&!modsRunning()){const mod=state.mods[Number(toggle.dataset.toggle)];if(mod)await operate('toggleMod',{directoryPath:mod.directoryPath,enabled:!mod.enabled});return;}const backup=event.target.closest('[data-backup]');if(backup&&!busy){const save=state.saves[Number(backup.dataset.backup)];if(save)await operate('backupSave',{directoryPath:save.directoryPath},'存档备份已创建。');return;}const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action;if(action==='refresh'){await refresh();return;}if(['minimize','maximize','close'].includes(action)){rpc(action).catch(()=>{});return;}if(action==='launch'){await operate(action,{useSmapi:state.settings.useSmapi,accent:appearanceValues().accent},'游戏已启动。');return;}await operate(action,target.dataset.kind?{kind:target.dataset.kind}:{},action==='importMod'?'Mod 列表已更新。':'');});

document.addEventListener('click',async event=>{

  if(action==='contentDetail'){const cached=(state.content?.downloads||[]).find(item=>item.itemId===node.dataset.itemId);const fallback=(catalog?.items||[]).find(item=>item.id===node.dataset.itemId)||(cached?{...cached,id:cached.itemId,description:'已下载的离线资源。'}:null);if(isOffline()){if(fallback){detailItem=fallback;detailKind='content';renderDetail();}else toast('此资源尚未保存离线详情。',true);return;}const result=await operate(action,{itemId:node.dataset.itemId});if(result?.id){detailItem=result;detailKind='content';renderDetail();}else if(fallback){detailItem=fallback;detailKind='content';renderDetail();}return;}
  if(action==='nexusDetail'){if(nexusMod){detailItem=nexusMod;detailKind='nexus';renderDetail();}return;}
  if(action==='communityDetail'){const result=await operate(action,{source:node.dataset.source,id:node.dataset.itemId});if(result?.id){detailItem={...result,communitySource:node.dataset.source};detailKind='community';renderDetail();}return;}
  if(action==='communityPage'){await loadCommunity(Number(node.dataset.resultPage)||1);return;}
  if(action==='downloadCommunity'){const install=node.dataset.install==='true';if(install&&!targetGame().installation?.hasGame){toast('请先选择当前游戏文件夹，再下载安装。',true);return;}if(install&&modsRunning()){toast('请先退出游戏，再安装 Mod。',true);return;}const index=Number(node.dataset.downloadIndex);await operate(action,{source:node.dataset.source,id:node.dataset.itemId,downloadIndex:Number.isInteger(index)?index:-1,install},install?'已安装到当前游戏。':'社区资源已下载到缓存。');return;}

    const result=await operate(action,{confirmed:true});if(result?.text!==undefined){aiResult=result;render();}return;
  }
  if(action==='clearAnalysisKey'){const current=state.analysis||{};const profile=activeAIProfile();invalidateAI();await operate('saveAnalysis',{...(current.activeProfileId?{profileId:current.activeProfileId}:{}),name:profile?.name||'我的 AI 连接',provider:profile?.provider||current.provider||'custom',endpoint:current.endpoint||'',model:current.model||'',sendLog:current.sendLog!==false,sendModList:current.sendModList!==false,allowLocalHttp:!!current.allowLocalHttp,compactLog:current.compactLog!==false,maxInputChars:current.maxInputChars||12000,logKeywords:current.logKeywords??defaultLogKeywords,clearApiKey:true},'当前连接的 API 密钥已清除。');return;}

});
document.addEventListener('submit',async event=>{
  const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();if(busy)return;
  const action=form.dataset.form;
  if(action==='saveAppearance'){const payload=readAppearanceForm(form);const result=await operate(action,payload,'外观已保存。');if(result){appearanceDraft=null;render();}return;}
  if(action==='communityList'){communitySource=formValue(form,'source')||'3dm';communityQuery=formValue(form,'query');await loadCommunity(1);return;}
  if(action==='saveAnalysis'){
    const payload={...readAIForm(form),apiKey:formValue(form,'apiKey')||null};if(aiEditingNew)payload.profileId='';else if(state.analysis?.activeProfileId)payload.profileId=state.analysis.activeProfileId;
    invalidateAI();const result=await operate(action,payload,'AI 连接与筛选设置已保存。');if(result){aiDraft=null;aiEditingNew=false;if(result.endpoint!==undefined)state.analysis=result;render();}return;
  }
  if(action==='addFeed'){const result=await operate(action,{url:formValue(form,'url')},'社区订阅已添加。');if(result&&!isOffline())await loadCatalog();return;}
  if(action==='downloadUrl'){await operate(action,{url:formValue(form,'url'),sha256:formValue(form,'sha256'),install:form.elements.install.checked},'ZIP 已下载并检查，资源列表已更新。');catalog=null;render();return;}
  if(action==='openNexusLink'){nexusLinkDraft=formValue(form,'url');browserInstall=!!form.elements.install.checked;await operate(action,{url:nexusLinkDraft,install:browserInstall&&!!targetGame().installation?.hasGame&&!modsRunning()});return;}
  if(action==='downloadSmapi'){await operate(action,{source:formValue(form,'source')||'domestic'});return;}
  if(action==='saveNexusKey'){await operate(action,{apiKey:formValue(form,'apiKey')},'Nexus 账户已连接。');return;}
  if(action==='saveNexusApplication'){const result=await operate(action,{applicationId:formValue(form,'applicationId')},'Nexus 应用 ID 已保存。');if(result){nexusAppDraft=null;render();}return;}
  if(action==='getNexusMod'){const modId=requireNexusId(formValue(form,'modId'));if(!modId)return;nexusModId=String(modId);const result=await operate(action,{modId});if(result?.files){nexusMod=result;render();}return;}
});
document.addEventListener('input',event=>{
  const target=event.target;
  if(target.id==='resourceSearch'){const caret=target.selectionStart;resourceSearch=target.value;render();const replacement=document.getElementById('resourceSearch');replacement?.focus();replacement?.setSelectionRange(caret,caret);return;}
  const form=target.closest('form[data-form]');
  if(form?.dataset.form==='saveAppearance'){appearanceDraft=readAppearanceForm(form);applyAppearance();for(const name of ['blur','opacity','panelOpacity']){const output=document.getElementById(name+'Value');if(output)output.textContent=Number(appearanceDraft[name])+(name==='blur'?' px':'%');}const discard=document.querySelector('[data-feature="discardAppearance"]');if(discard)discard.disabled=busy;return;}
  if(form?.dataset.form==='openNexusLink'&&target.name==='url')nexusLinkDraft=target.value;
  if(form?.dataset.form==='getNexusMod'&&target.name==='modId'){nexusModId=target.value;const external=form.querySelector('[data-feature="openNexusMod"]');if(external)external.disabled=busy||isOffline()||!/^[1-9][0-9]{0,8}$/.test(nexusModId);}
  if(form?.dataset.form==='saveNexusApplication'&&target.name==='applicationId')nexusAppDraft=target.value;
  if(form?.dataset.form==='saveAnalysis'){
    aiDraft=readAIForm(form);invalidateAI();const modelsButton=document.querySelector('[data-feature="analysisModels"]');if(modelsButton)modelsButton.disabled=true;const previewButton=document.querySelector('[data-feature="analysisPreview"]');if(previewButton)previewButton.disabled=true;
  }
});
document.addEventListener('change',async event=>{
  const target=event.target;if(target.id==='offlineMode')offlineModeDraft=target.value;
  if(target.id==='browserInstall'){browserInstall=target.checked;return;}
  if(target.dataset?.modSelect!==undefined){if(busy||modsRunning())return;const mod=state.mods[Number(target.dataset.modSelect)];if(mod){if(target.checked)selectedMods.add(mod.directoryPath);else selectedMods.delete(mod.directoryPath);render();}return;}
  if(target.id==='modSelectAll'){if(busy||modsRunning())return;for(const {mod} of visibleMods()){if(target.checked)selectedMods.add(mod.directoryPath);else selectedMods.delete(mod.directoryPath);}render();return;}
  if(target.id==='communitySource'){communitySource=target.value;communityCatalog=null;communityPage=1;return;}
  if(target.id==='analysisProfile'&&!busy&&target.value&&target.value!==state.analysis?.activeProfileId){aiDraft=null;aiEditingNew=false;aiModels=[];invalidateAI();const result=await operate('selectAnalysisProfile',{profileId:target.value});if(result?.endpoint!==undefined)state.analysis=result;render();return;}
  if(target.id==='analysisProvider'){const form=target.closest('form[data-form]');aiDraft=readAIForm(form);aiDraft.endpoint=aiProviders[target.value]?.[1]||'';aiDraft.model='';aiDraft.allowLocalHttp=target.value==='ollama';aiModels=[];invalidateAI();render();return;}
  if(target.id==='analysisModelSelect'&&target.value){const form=target.closest('form[data-form]');form.elements.model.value=target.value;aiDraft=readAIForm(form);invalidateAI();const modelsButton=document.querySelector('[data-feature="analysisModels"]');if(modelsButton)modelsButton.disabled=true;return;}
  if(target.id==='aiConsent'){aiConfirm=target.checked;const send=document.getElementById('analyzeButton');if(send)send.disabled=busy||isOffline()||!state.analysis?.endpoint||!aiConfirm||!aiPreview||!!aiDraft||aiEditingNew;}
});
document.getElementById('dragRegion').addEventListener('pointerdown',event=>{if(event.button===0&&event.detail<2&&!event.target.closest('button,select,input')){event.preventDefault();rpc('drag').catch(()=>{});}});
document.getElementById('dragRegion').addEventListener('dblclick',event=>{if(!event.target.closest('button,select,input')){event.preventDefault();rpc('maximize').catch(()=>{});}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&detailItem){detailItem=null;renderDetail();}});
render();refresh();setInterval(()=>{if(!busy&&!document.hidden&&page!=='about')refresh(true);},12000);
</script>
</body>
</html>
